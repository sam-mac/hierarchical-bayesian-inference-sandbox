[project]
name = "bayes-tools"
version = "0.2.0"
description = "Hierarchical Bayesian LGSSM sandbox with NumPyro and Dynamax interoperability"
authors = [{ name = "Samual MacDonald" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"

dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
inference = [
    "jax>=0.5",
    "jaxlib>=0.5",
    "numpyro>=0.16",
    "dynamax>=1.0.1",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ipykernel",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.hatch.build.targets.wheel]
packages = ["src/bayes_tools"]

[tool.hatch.build.targets.sdist]
include = ["src/bayes_tools", "README.md", "LICENSE"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
